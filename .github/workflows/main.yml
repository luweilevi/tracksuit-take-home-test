# Published GitHub Release → GitHub environment "production".
name: Main

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: production
      extra_tag: ${{ github.event.release.tag_name }}

  deploy:
    needs: build
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: production
      image: ${{ needs.build.outputs.image }}
