# Test (reusable workflow) then build SPA + API image.
# Called by dev.yml and main.yml. Does not deploy.
#
# Inputs.environment GitHub environment vars:
#   AWS_ROLE_ARN, AWS_REGION, ECR_REPOSITORY
name: Build

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment (dev or production)
        type: string
        required: true
      extra_tag:
        description: Extra ECR tag (e.g. pr-12 or v1.0.0)
        type: string
        required: false
        default: ""
    outputs:
      image:
        description: ECR image URI tagged with git sha
        value: ${{ jobs.server.outputs.image }}

jobs:
  client:
    name: Build client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.4.2"

      - name: Vite production build
        run: deno task build:client

      - uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: client/build
          if-no-files-found: error

  server:
    name: Build Server image
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.tags.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-build-api-${{ github.run_id }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Image tags
        id: tags
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: ${{ vars.ECR_REPOSITORY }}
          EXTRA_TAG: ${{ inputs.extra_tag }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${REPO}:${GITHUB_SHA}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${image}"
            if [ -n "${EXTRA_TAG}" ]; then
              echo "${REGISTRY}/${REPO}:${EXTRA_TAG}"
            fi
            if [ "${ENVIRONMENT}" = "production" ]; then
              echo "${REGISTRY}/${REPO}:production"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
