# Test (reusable workflow) then build SPA + API image.
# Called by dev.yml and main.yml. Does not deploy.
#
# Inputs.environment GitHub environment vars:
#   AWS_ROLE_ARN, AWS_REGION, ECR_REPOSITORY
name: Build

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment (dev or production)
        type: string
        required: true
      extra_tag:
        description: Extra ECR tag (e.g. pr-12 or v1.0.0)
        type: string
        required: false
        default: ""
    outputs:
      image:
        description: ECR image URI tagged with git sha
        value: ${{ jobs.server.outputs.image }}

jobs:
  client:
    name: Build client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.4.2"

      - name: Vite production build
        run: deno task build:client

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: client-build
          path: client/build
          if-no-files-found: error

  server:
    name: Build Server image
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.tags.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-build-api-${{ github.run_id }}

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        id: ecr

      - name: Image tags
        id: tags
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: ${{ vars.ECR_REPOSITORY }}
          EXTRA_TAG: ${{ inputs.extra_tag }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${REPO}:${GITHUB_SHA}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${image}"
            if [ -n "${EXTRA_TAG}" ]; then
              echo "${REGISTRY}/${REPO}:${EXTRA_TAG}"
            fi
            if [ "${ENVIRONMENT}" = "production" ]; then
              echo "${REGISTRY}/${REPO}:production"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
