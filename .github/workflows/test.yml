name: Test

on:
  workflow_call:

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.4.2"

      - name: Typecheck
        run: deno check .

      - name: Server tests
        run: deno task test:server

      - name: Client tests
        run: deno task test:client
